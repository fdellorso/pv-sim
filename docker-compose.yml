services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pvsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pvsim}
      POSTGRES_DB: ${POSTGRES_DB:-pvsim}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pvsim} -d ${POSTGRES_DB:-pvsim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pvsim}:${POSTGRES_PASSWORD:-pvsim}@postgres:5432/${POSTGRES_DB:-pvsim}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    command: ["uvicorn", "src.web.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pvsim}:${POSTGRES_PASSWORD:-pvsim}@postgres:5432/${POSTGRES_DB:-pvsim}
      REDIS_URL: redis://redis:6379/0
      APP_PASSWORD: ${APP_PASSWORD:-change-me}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
    volumes:
      - ./data/load_profiles:/data/load_profiles
      - ./data/simulation_data:/data/simulation_data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["arq", "src.worker.main.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pvsim}:${POSTGRES_PASSWORD:-pvsim}@postgres:5432/${POSTGRES_DB:-pvsim}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/load_profiles:/data/load_profiles
      - ./data/simulation_data:/data/simulation_data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
